<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6.5 44 44">
  <!-- Quest Log // HUD logo: the chest glowing gold on the HUD's black -->
  <defs>
    <radialGradient id="glow" cx="16" cy="15.5" r="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#ffd166" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="-6" y="-6.5" width="44" height="44" rx="9" fill="#000"/>
  <rect x="-6" y="-6.5" width="44" height="44" rx="9" fill="url(#glow)"/>
  <!-- The treasure chest from the reward screen (wood skin), 1 unit = 1 pixel -->
  <g shape-rendering="crispEdges">
    <rect fill="#3b2412" x="1" y="13" width="30" height="14"/>
    <rect fill="#8b5a2b" x="2" y="14" width="28" height="12"/>
    <rect fill="#5c3a1a" x="2" y="23" width="28" height="3"/>
    <rect fill="#ffd166" x="4" y="14" width="3" height="12"/>
    <rect fill="#ffd166" x="25" y="14" width="3" height="12"/>
    <rect fill="#ffd166" x="13" y="13" width="6" height="6"/>
    <rect fill="#3b2412" x="15" y="15" width="2" height="2"/>
    <rect fill="#3b2412" x="1" y="4" width="30" height="10"/>
    <rect fill="#8b5a2b" x="2" y="5" width="28" height="8"/>
    <rect fill="#c47f3c" x="2" y="5" width="28" height="2"/>
    <rect fill="#5c3a1a" x="2" y="11" width="28" height="2"/>
    <rect fill="#ffd166" x="4" y="5" width="3" height="8"/>
    <rect fill="#ffd166" x="25" y="5" width="3" height="8"/>
  </g>
</svg>
